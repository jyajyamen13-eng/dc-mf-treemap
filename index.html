<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桜千株式会社 — お金のブロックパズル (2026-10-26 10:58 JST)</title>

  <!-- Inter (英数字) + Noto Sans JP (日本語) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ════════════════════════════════════════════════════════
     * デザイントークン  — デジタル庁 Design System 準拠
     * ════════════════════════════════════════════════════════ */
    :root {
      /* Blue family (primary) */
      --blue-50:  #EEF2FF;
      --blue-100: #D9E6FF;
      --blue-300: #9DB7F9;
      --blue-500: #4979F5;
      --blue-700: #264AF4;
      --blue-900: #0017C1;

      /* Neutrals */
      --gray-0:   #FFFFFF;
      --gray-50:  #FAFAFB;
      --gray-100: #F4F5F7;
      --gray-200: #E8EAEE;
      --gray-300: #D5D8DE;
      --gray-400: #A0A4AB;
      --gray-500: #6B7280;
      --gray-700: #3F4451;
      --gray-900: #1A1A1A;

      /* Semantic — 利益/CF 系統（落ち着いたゴールド） */
      --gold-50:  #FFFBEB;
      --gold-100: #FEF3C7;
      --gold-300: #F5D070;
      --gold-500: #C99830;
      --gold-700: #8A6313;

      /* Semantic — 粗利系統（深い緑） */
      --green-50:  #ECFDF5;
      --green-100: #D1FAE5;
      --green-300: #6EE7B7;
      --green-500: #10B981;
      --green-700: #047857;

      /* Semantic — 変動費・固定費 警告系統（控えめな赤橙） */
      --warn-50:  #FFF7ED;
      --warn-100: #FFEDD5;
      --warn-300: #FDBA74;
      --warn-500: #F97316;
      --warn-700: #C2410C;

      /* 赤字（経常損失）表示用 */
      --red-50:  #FEF2F2;
      --red-600: #DC2626;
      --red-700: #B91C1C;

      /* 影 */
      --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.08), 0 2px 4px -2px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.04);

      /* Radius */
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;

      /* タイポグラフィ */
      --font-sans: "Inter", "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Meiryo", "Yu Gothic", sans-serif;
      --font-num:  "Inter", "Noto Sans JP", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body {
      font-family: var(--font-sans);
      background: var(--gray-50);
      color: var(--gray-900);
      min-height: 100vh;
      line-height: 1.5;
      font-feature-settings: "tnum" 1, "palt" 1;
    }

    /* ════════════════════════════════════════════════════════
     * ヘッダー
     * ════════════════════════════════════════════════════════ */
    header.app-header {
      background: var(--gray-0);
      border-bottom: 1px solid var(--gray-200);
      padding: 20px 40px 18px;
    }
    .header-inner {
      max-width: 1560px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
    }
    .brand-block { display: flex; align-items: center; gap: 14px; }
    .brand-mark {
      width: 36px; height: 36px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--blue-500) 0%, var(--blue-700) 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow-md);
      color: #fff; font-weight: 700; font-size: 1rem; letter-spacing: 0.05em;
    }
    .brand-text h1 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--gray-900);
      letter-spacing: 0.01em;
      line-height: 1.3;
    }
    .brand-text .subtitle {
      font-size: 0.72rem;
      color: var(--gray-500);
      font-weight: 500;
      letter-spacing: 0.04em;
      margin-top: 2px;
    }

    .header-controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    #period-label {
      font-size: 0.78rem;
      color: var(--gray-500);
      font-weight: 500;
      padding: 8px 14px;
      background: var(--gray-100);
      border-radius: var(--radius-sm);
      letter-spacing: 0.01em;
      font-variant-numeric: tabular-nums;
    }

    /* 部門切替ピル */
    .dept-pills {
      display: inline-flex;
      background: var(--gray-100);
      border-radius: 9px;
      padding: 3px;
      gap: 2px;
    }
    .dept-pills button {
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--gray-500);
      padding: 7px 14px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.15s ease;
      letter-spacing: 0.02em;
    }
    .dept-pills button:hover { color: var(--gray-900); }
    .dept-pills button.active {
      background: var(--gray-0);
      color: var(--blue-700);
      font-weight: 600;
      box-shadow: var(--shadow-xs);
    }
    /* 旧 select は非表示で残す（互換用） */
    #dept-select { display: none; }

    /* 会計期切替ピル（standalone モードでのみ可視化される）。
       server.py 経路では JS で表示制御しないので display:none のまま。 */
    .fy-pills {
      display: none;
      background: var(--blue-50);
      border-radius: 9px;
      padding: 3px;
      gap: 2px;
      border: 1px solid var(--blue-100);
    }
    .fy-pills button {
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 0.76rem;
      font-weight: 500;
      color: var(--blue-700);
      padding: 7px 12px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.15s ease;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .fy-pills button:hover { background: var(--blue-100); }
    .fy-pills button.active {
      background: var(--blue-700);
      color: var(--gray-0);
      font-weight: 600;
      box-shadow: var(--shadow-xs);
    }
    .fy-pills button .fy-sub {
      display: block;
      font-size: 0.65rem;
      opacity: 0.75;
      font-weight: 400;
      margin-top: 1px;
    }

    /* 通年推移タブ（standalone のみ・build-standalone.py の renderTrend が使う） */
    .trend-conclusion { font-size: 0.95rem; font-weight: 700; color: var(--gray-900); line-height: 1.6; margin: 2px 0 10px; }
    .trend-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.74rem; color: var(--gray-700); margin-bottom: 4px; }
    .trend-leg { display: inline-flex; align-items: center; gap: 6px; }
    .trend-leg i { display: inline-block; width: 14px; height: 12px; border-radius: 2px; }
    .trend-leg i.trend-leg-line { width: 22px; height: 3px; border-radius: 2px; }
    .trend-svg { width: 100%; height: auto; display: block; }
    .trend-svg .trend-axis   { font-size: 12px; fill: var(--gray-500); font-family: var(--font-num); }
    .trend-svg .trend-val    { font-size: 15px; font-weight: 700; font-family: var(--font-num); }
    .trend-svg .trend-gp     { fill: var(--green-700); }
    .trend-svg .trend-fc     { fill: var(--warn-700); }
    .trend-svg .trend-year   { font-size: 15px; font-weight: 700; fill: var(--gray-900); }
    .trend-svg .trend-period { font-size: 12px; fill: var(--gray-500); font-family: var(--font-num); }
    .trend-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.82rem; }
    .trend-table th, .trend-table td { padding: 6px 12px; border-bottom: 1px solid var(--gray-200); }
    .trend-table thead th { text-align: right; color: var(--gray-500); font-weight: 600; font-size: 0.74rem; }
    .trend-table thead th:first-child, .trend-table tbody th { text-align: left; }
    .trend-table tbody th { font-weight: 600; color: var(--gray-900); white-space: nowrap; }
    .trend-table tbody th span { margin-left: 10px; font-weight: 400; font-size: 0.72rem; color: var(--gray-500); font-family: var(--font-num); }
    .trend-table td.num { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; color: var(--gray-700); }
    .trend-table td.trend-neg-cell { color: var(--red-700); font-weight: 700; }
    .trend-hq-table thead th { white-space: nowrap; }
    .trend-hq-toggle { margin-left: 12px; font: inherit; font-size: 0.78rem; font-weight: 600; color: var(--blue-700);
      background: var(--blue-50); border: 1px solid var(--blue-300); border-radius: 7px; padding: 5px 12px; cursor: pointer; }
    .trend-hq-toggle.on { background: var(--blue-700); color: var(--gray-0); border-color: var(--blue-700); }
    .trend-svg .trend-missing { font-size: 14px; font-weight: 600; fill: var(--gray-400); }
    .trend-table .trend-missing-mark { margin-left: 8px; font-style: normal; font-size: 0.7rem; color: var(--gray-500); }
    .trend-table td.trend-missing-cell, .trend-table td.trend-hq-done { color: var(--gray-400); }
    .trend-pair-note { font-size: 0.8rem; font-weight: 600; color: var(--gray-500); margin: 0 0 10px 2px; }
    .trend-total > summary { cursor: pointer; font-size: 0.82rem; font-weight: 600; color: var(--blue-700); padding: 6px 2px 12px; }

    /* データなし期用プレースホルダー */
    .no-data-block {
      background: var(--gray-0);
      border: 1px dashed var(--gray-300);
      border-radius: var(--radius-lg);
      padding: 60px 40px;
      text-align: center;
      box-shadow: var(--shadow-xs);
      margin-top: 24px;
    }
    .no-data-block .no-data-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--gray-900);
      margin-bottom: 14px;
    }
    .no-data-block .no-data-note {
      font-size: 0.95rem;
      color: var(--warn-700);
      background: var(--warn-50);
      border: 1px solid var(--warn-100);
      border-radius: var(--radius-md);
      padding: 12px 18px;
      max-width: 720px;
      margin: 0 auto 18px;
      line-height: 1.6;
    }
    .no-data-block .no-data-hint {
      font-size: 0.85rem;
      color: var(--gray-500);
    }

    #refresh-btn {
      padding: 8px 16px;
      background: var(--gray-900);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.76rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, transform 0.05s;
      letter-spacing: 0.02em;
    }
    #refresh-btn:hover { background: #000; }
    #refresh-btn:active { transform: translateY(1px); }
    #refresh-btn:disabled { background: var(--gray-300); color: var(--gray-500); cursor: not-allowed; }

    /* ════════════════════════════════════════════════════════
     * メインコンテナ
     * ════════════════════════════════════════════════════════ */
    main {
      max-width: 1560px;
      margin: 28px auto;
      padding: 0 28px 56px;
    }

    /* ════════════════════════════════════════════════════════
     * KPI ストリップ — 上部の主要指標 4 枚
     * ════════════════════════════════════════════════════════ */
    .kpi-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }
    .kpi-card {
      background: var(--gray-0);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      box-shadow: var(--shadow-xs);
      position: relative;
      overflow: hidden;
    }
    .kpi-card::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--blue-500);
      border-radius: 0 2px 2px 0;
    }
    .kpi-card.kpi-revenue::before { background: var(--blue-500); }
    .kpi-card.kpi-gross::before   { background: var(--green-500); }
    .kpi-card.kpi-profit::before  { background: var(--gold-500); }
    .kpi-card.kpi-cash::before    { background: var(--gold-700); }

    .kpi-label {
      font-size: 0.72rem;
      color: var(--gray-500);
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .kpi-value {
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--gray-900);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.015em;
      line-height: 1.1;
      font-family: var(--font-num);
    }
    .kpi-sub {
      font-size: 0.72rem;
      color: var(--gray-500);
      margin-top: 6px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.01em;
    }
    .kpi-sub strong {
      color: var(--gray-700);
      font-weight: 600;
    }

    /* ════════════════════════════════════════════════════════
     * パズルカード — ブロックパズルのコンテナ
     * ════════════════════════════════════════════════════════ */
    .puzzle-card {
      background: var(--gray-0);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-xs);
      padding: 22px 26px 26px;
      margin-bottom: 18px;
    }
    .card-head {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 14px;
      gap: 16px;
      flex-wrap: wrap;
    }
    .card-head h2 {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--gray-900);
      letter-spacing: 0.01em;
    }
    .card-head .head-sub {
      font-size: 0.72rem;
      color: var(--gray-500);
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    /* ────  構造式チップ列 ──── */
    .formula-row {
      display: flex; gap: 10px; flex-wrap: wrap;
      margin-bottom: 16px;
      padding: 10px 12px;
      background: var(--gray-50);
      border-radius: var(--radius-sm);
      align-items: center;
    }
    .formula-chip {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 0.7rem;
      color: var(--gray-700);
      letter-spacing: 0.02em;
      font-weight: 500;
      white-space: nowrap;
    }
    .formula-chip .em { font-weight: 700; }
    .formula-chip.gross .em   { color: var(--green-700); }
    .formula-chip.fixed .em   { color: var(--warn-700); }
    .formula-chip.profit .em  { color: var(--gold-700); }
    .formula-divider {
      width: 1px;
      height: 14px;
      background: var(--gray-300);
    }

    .formula-note {
      font-size: 0.66rem;
      color: var(--gray-400);
      margin-bottom: 14px;
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    /* ──── 配賦注記（クラスタ時のみ）──── */
    #cluster-allocation-note {
      display: none;
      font-size: 0.72rem;
      color: var(--warn-700);
      margin-bottom: 16px;
      padding: 9px 14px;
      font-weight: 500;
      letter-spacing: 0.01em;
      background: var(--warn-50);
      border-left: 3px solid var(--warn-500);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }

    /* ════════════════════════════════════════════════════════
     * パズル本体 + CF 拡張を横並びにするフレックス
     * ════════════════════════════════════════════════════════ */
    .puzzle-row-wrap {
      overflow-x: auto;
      overflow-y: visible;
      margin: 0 -2px;  /* スクロールバー領域確保 */
      padding: 2px;
    }
    .puzzle-row {
      display: flex;
      align-items: flex-start;
      background: var(--gray-50);
      border-radius: var(--radius-md);
      padding: 14px;
      overflow: visible;
      min-width: 1100px;  /* モバイルでも横スクロールで全体が見える */
    }

    /* パズル本体コンテナ */
    #puzzle-canvas {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    /* CF 拡張コンテナ（puzzle-row 右側） */
    #cf-extension-row {
      position: relative;
      flex: 0 0 auto;
      margin-left: 14px;
      padding-left: 14px;
      border-left: 1px solid var(--gray-200);
      overflow: visible;
    }

    /* ════════════════════════════════════════════════════════
     * 各ブロック（absolute配置）
     * ════════════════════════════════════════════════════════ */
    .bp-cell {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: filter 0.15s;
    }
    .bp-cell:hover { filter: brightness(0.98); }

    .bp-cell .cell-label,
    .fixed-sub-cell .cell-label {
      font-size: 0.82rem;
      font-weight: 600;
      text-align: center;
      line-height: 1.35;
      letter-spacing: 0.02em;
    }
    .bp-cell .cell-amount,
    .fixed-sub-cell .cell-amount {
      font-size: 1.05rem;
      font-weight: 700;
      margin-top: 6px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
      font-family: var(--font-num);
    }

    /* 固定費内部の人件費・その他固定費（flex子として積む） */
    .fixed-sub-cell {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      flex-shrink: 0;
      overflow: hidden;
    }

    /* ──── 配色（一貫したカラーシステム）──── */
    .cell-revenue   { background: var(--blue-100);  color: var(--blue-900); }
    .cell-variable  { background: var(--gray-100);  color: var(--gray-700); }
    .cell-gross     { background: var(--green-100); color: var(--green-700); }
    .cell-fixed     { background: var(--warn-50);   color: var(--warn-700); }
    .cell-personnel { background: var(--gray-50);   color: var(--gray-700); }
    .cell-other     { background: var(--gray-100);  color: var(--gray-700); }
    .cell-profit    { background: var(--gold-100);  color: var(--gold-700); }

    .cell-revenue .cell-label,   .cell-revenue .cell-amount   { color: var(--blue-900); }
    .cell-variable .cell-label,  .cell-variable .cell-amount  { color: var(--gray-700); }
    .cell-gross .cell-label,     .cell-gross .cell-amount     { color: var(--green-700); }
    .cell-personnel .cell-label, .cell-personnel .cell-amount { color: var(--gray-700); }
    .cell-other .cell-label,     .cell-other .cell-amount     { color: var(--gray-700); }
    .cell-profit .cell-label,    .cell-profit .cell-amount    { color: var(--gold-700); }
    /* 赤字の期: 利益ブロックを赤字として赤文字・赤枠で示す。枠は inset の影で描き、
       セルの寸法（ブロック配置計算）を変えない */
    .cell-profit.is-loss { background: var(--red-50); box-shadow: inset 0 0 0 2px var(--red-600); }
    .cell-profit.is-loss .cell-label, .cell-profit.is-loss .cell-amount { color: var(--red-700); }

    /* ──── 自動外出しラベル（セルに収まらない内容をピルで外へ）──── */
    .auto-out {
      position: absolute;
      background: var(--gray-0);
      border: 1px solid var(--gray-300);
      border-radius: 6px;
      padding: 4px 10px;
      text-align: center;
      white-space: nowrap;
      z-index: 30;
      pointer-events: none;
      box-shadow: var(--shadow-sm);
      font-family: var(--font-num);
      line-height: 1.25;
    }
    .auto-out .cell-label, .auto-out .cf-label {
      font-size: 0.66rem; font-weight: 600; letter-spacing: .04em;
    }
    .auto-out .cell-amount, .auto-out .cf-amount {
      font-size: 0.86rem; font-weight: 700; margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }
    .auto-out .cf-breakdown { margin-top: 3px !important; }

    /* ──── インラインタグ（粗利率・労働分配率）──── */
    /* 旧 oval-badge を置き換え。ブロックの角に控えめに配置 */
    .inline-tag {
      position: absolute;
      background: var(--gray-0);
      border: 1px solid var(--gray-200);
      border-radius: 999px;
      padding: 5px 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      z-index: 20;
      pointer-events: none;
      box-shadow: var(--shadow-sm);
      font-family: var(--font-num);
    }
    .inline-tag .tag-label {
      font-size: 0.66rem;
      color: var(--gray-500);
      font-weight: 600;
      letter-spacing: 0.04em;
    }

<body>

<header class="app-header">
  <div class="header-inner">
    <div class="brand-block">
      <div class="brand-mark">桜</div>
      <div class="brand-text">
        <h1>桜千株式会社 — お金のブロックパズル</h1>
        <div class="subtitle">マネーフォワード クラウド会計 ・ 和仁達也方式</div>
      </div>
    </div>
    <div class="header-controls">
      <!-- 会計期切替ピル (standalone モードでのみ JS が visible にする) -->
      <div class="fy-pills" id="fy-pills">
        <!-- ボタン中身は standalone ビルド時に埋め込みデータの fiscal_years
             (当期〜fy2021、新しい順) から initFyPills() が動的生成する。
             data-fy-key は build 側の default_year_key / year_key と一致する。 -->
      </div>
      <div class="dept-pills" id="dept-pills">
        <button data-val="" class="active">全社合計</button>
        <button data-val="cluster:工事部">工事部</button>
        <button data-val="cluster:事業開発部">事業開発部</button>
      </div>
      <select id="dept-select">
        <option value="">全社合計</option>
        <option value="cluster:工事部">工事部</option>
        <option value="cluster:事業開発部">事業開発部</option>
      </select>
      <span id="period-label">読み込み中...</span>
      <button id="refresh-btn">更新</button>
    </div>
  </div>
</header>

<main id="main-content">
  <div class="loading">データを読み込んでいます...</div>
</main>

<script>
/* ═══════════════════════════════════════════════════════
 * フォーマットユーティリティ
 * ═══════════════════════════════════════════════════════ */
const fmt = (v) => {
  if (v == null || isNaN(v)) return '—';
  const abs  = Math.abs(v);
  const sign = v < 0 ? '-' : '';
  if (abs >= 100_000_000) return sign + (abs / 100_000_000).toFixed(1) + '億円';
  if (abs >= 10_000)      return sign + Math.round(abs / 10_000).toLocaleString() + '万円';
  return sign + abs.toLocaleString() + '円';
};
const toMan = (v) => Math.round((v || 0) / 10_000);
// 外から来た文字列（MF の科目名・エラーメッセージ）を HTML に埋める時は必ずこれを通す
const escHtml = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const fmtMan = (man) => {
  if (man == null || isNaN(man)) return '—';
  const abs  = Math.abs(man);
  const sign = man < 0 ? '-' : '';
  return sign + abs.toLocaleString() + '万円';
};
const pctStr = (part, whole) => {
  if (!whole) return '—';
  return (part / whole * 100).toFixed(1) + '%';
};
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

/* ═══════════════════════════════════════════════════════
 * 状態
 * ═══════════════════════════════════════════════════════ */
let _currentSelectVal = '';

/* ═══════════════════════════════════════════════════════
 * データ取得（server.py 連携時）
 * ═══════════════════════════════════════════════════════ */
async function loadData(selectVal) {
  // standalone mode: embedded data から読み出し（API call なし）
  const all = window.__EMBEDDED_DATA__;
  if (!all || !Array.isArray(all.fiscal_years)) {
    throw new Error('埋め込みデータが見つかりません (window.__EMBEDDED_DATA__.fiscal_years)');
  }
  // 現在選択中の会計期を取得
  const fyKey = window.__currentFyKey || all.default_year_key;
  // 通年推移タブ: ブロック図の代わりに推移グラフを描く（描画は renderTrend）。
  // 既存の各ハンドラの「データなし」分岐を通して renderNoDataPlaceholder → renderTrend へ渡す
  if (fyKey === TREND_KEY) {
    const done = trendYears();
    return {
      bp: null, commentary: '', _no_data: true, _trend: true,
      _fy_label: '通年推移',
      _fy_period: done.length ? (done[0].year_label + ' 〜 ' + done[done.length - 1].year_label + '（完了期のみ）') : ''
    };
  }
  const fyEntry = all.fiscal_years.find(f => f.year_key === fyKey);
  if (!fyEntry) {
    throw new Error('会計期データが見つかりません: ' + fyKey);
  }
  // データなし期の場合は明示的にシグナルを返す（render 側で UI 切替）
  if (!fyEntry.data_available) {
    return {
      bp: null,
      commentary: '',
      _no_data: true,
      _fy_label: fyEntry.year_label,
      _fy_period: fyEntry.period,
      _fy_note: fyEntry.note || 'データなし'
    };
  }
  // 部門キーの解決
  let key;
  if (!selectVal) {
    key = '全社合計';
  } else if (selectVal.startsWith('cluster:')) {
    key = selectVal.slice('cluster:'.length);
  } else {
    // department_id 直接指定は standalone では未対応 → 全社合計にフォールバック
    key = '全社合計';
  }
  const entry = fyEntry[key];
  // 部門の実数が無い期（部門の入力なし等）: 推定値は出さず理由を出す
  if (entry && !entry.bp && entry.missing) {
    return {
      bp: null, commentary: '', _no_data: true, _dept_missing: true,
      _dept_name: key, _fy_label: fyEntry.year_label, _fy_period: fyEntry.period, _fy_note: entry.missing
    };
  }
  if (!entry || !entry.bp) {
    throw new Error('埋め込みデータにキーがありません: ' + fyKey + '/' + key);
  }
  return {
    bp: entry.bp,
    commentary: entry.commentary || '',
    _fy_label: fyEntry.year_label,
    _fy_period: fyEntry.period
  };
}

/* ═══════════════════════════════════════════════════════
 * 部門ピル初期化
 * ═══════════════════════════════════════════════════════ */
async function initDeptSelector() {
  const pills = document.getElementById('dept-pills');
  const sel = document.getElementById('dept-select');
  if (!pills) return;

  pills.addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-val]');
    if (!btn) return;
    pills.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
    const val = btn.dataset.val;
    if (sel) sel.value = val;
    _currentSelectVal = val;
    const label = btn.textContent;
    document.getElementById('main-content').innerHTML =
      `<div class="loading">${label} のデータを読み込んでいます...</div>`;
    try {
      const result = await loadData(_currentSelectVal);
      if (result._no_data) {
        document.getElementById('main-content').innerHTML = renderNoDataPlaceholder(result);
        document.getElementById('period-label').textContent =
          (result._fy_label || '') + ' ' + (result._fy_period || '');
        _bpData = null;
        _bpCmt = '';
        return;
      }
      _bpData = result.bp;
      _bpCmt  = result.commentary;
      render(result.bp, result.commentary);
      if (result._fy_label) {
        document.getElementById('period-label').textContent =
          result._fy_label + ' ' + (result._fy_period || '');
      }
    } catch (e) {
      document.getElementById('main-content').innerHTML =
        `<div class="error-msg">データ読み込みエラー: ${escHtml(e.message)}</div>`;
    }
  });
}

/* ═══════════════════════════════════════════════════════
 * CF 拡張描画 — シンプル化版
 *   - ①②③ バッジ撤廃
 *   - ＋ ＝ 演算子撤廃（タイトルで補足）
 *   - 太い SVG 矢印 + "減価償却費の繰戻" テキスト撤廃
 *   - CF パネルのフローティングヘッダー撤廃 → カード上に控えめなラベル
 * ═══════════════════════════════════════════════════════ */
function renderCFExtension(bp, layout) {
  const canvas    = document.getElementById('puzzle-canvas');
  const cfRow     = document.getElementById('cf-extension-row');
  const puzzleRow = canvas ? canvas.parentElement : null;
  if (!canvas || !cfRow || !puzzleRow) return;

  const profitVal   = bp.profit         || 0;
  const taxAmt      = bp.income_taxes   || 0;
  const netInc      = bp.net_income     || (profitVal - taxAmt);
  const depr        = bp.depreciation   || 0;
  const cashGen     = bp.cash_generation || (netInc + depr);

  const { vcH, opH, subH, PUZZLE_H, CANVAS_H, isLoss } = layout;
  const special     = bp.special_items  || 0;   // 特別損益（税引後利益 - 経常利益 + 法人税）

  const profitTop = vcH + subH;
  const cfH       = opH;
  const CF_COL_W  = 130;
  // 比率厳守。MIN_CELL_H clamp は使わない（合計が cfH を超えるのを防ぐ）
  const MIN_CELL_H = 1;
  const LABEL_MIN_H = 16;  // テキスト表示するための最小高さ

  // ── 万円整合性 ──
  const profit_man_adj = layout.op_man_adj;
  const taxAmt_man     = toMan(taxAmt);
  // 特別損益がある期は、税引後利益を MF 当期純利益の万円値に合わせ、差を特別損益として示す
  //（経常利益 − 法人税等 ＋ 特別損益 ＝ 税引後利益 が画面の万円表示で成り立つ）。
  // 特別損益 0 の期は従来の計算のまま。
  const special_man    = special !== 0 ? toMan(netInc) - (profit_man_adj - taxAmt_man) : 0;
  const netInc_man     = profit_man_adj - taxAmt_man + special_man;
  const depr_man       = toMan(depr);
  const cashGen_man    = netInc_man + depr_man;

  // 赤字の期・特別損益がある期は、高さの比率で描くと 0 や負になるので数式で示す
  if (isLoss || special_man !== 0 || netInc <= 0) {
    const COL_GAP_F = 6;
    const W = CF_COL_W * 3 + COL_GAP_F * 2;
    const amt = (man, signed) => {
      const txt = (signed && man > 0 ? '+' : '') + fmtMan(man);
      return `<span class="cf-f-amt${man < 0 ? ' cf-f-neg' : ''}">${txt}</span>`;
    };
    const rows = [
      ['経常利益', amt(profit_man_adj), ''],
      // 法人税等がマイナス（還付等）の期は、引き算の符号が紛れないよう「＋」で示す
      taxAmt_man < 0 ? ['＋ 法人税等（還付等）', amt(-taxAmt_man, true), '']
                     : ['− 法人税等', amt(taxAmt_man), ''],
    ];
    if (special_man !== 0) rows.push(['＋ 特別損益', amt(special_man, true), '']);
    rows.push(['＝ 税引後利益', amt(netInc_man), ' cf-f-total']);
    rows.push(['＋ 減価償却費', amt(depr_man), '']);
    rows.push(['＝ CF 生成額', amt(cashGen_man), ' cf-f-total']);
    cfRow.style.width  = W + 'px';
    cfRow.style.height = (CANVAS_H || PUZZLE_H) + 'px';
    cfRow.innerHTML = `
      <div class="cf-section-mini" style="position:absolute; top:6px; left:2px; margin:0; z-index:5;">キャッシュフロー生成</div>
      <div class="cf-formula" style="width:${W}px;">
        ${rows.map(r => `<div class="cf-f-row${r[2]}"><span>${r[0]}</span>${r[1]}</div>`).join('')}
      </div>`;
    puzzleRow.querySelectorAll('.cf-arrow-svg').forEach(el => el.remove());
    return;
  }

  // ── Col1 (法人税 / 税引後利益) 比率厳守: taxH + netH = cfH ──
  let taxH;
  if (profitVal > 0 && taxAmt > 0) {
    taxH = Math.round(cfH * taxAmt / profitVal);
    taxH = Math.max(0, Math.min(taxH, cfH));
  } else {
    taxH = 0;
  }
  const netH = cfH - taxH;  // 残りが税引後利益、合計厳守

  // ── Col2/Col3 比率厳守: cfCol2H = cfH × cashGen / netInc ──
  let cfCol2H;
  if (netInc > 0 && cashGen > 0) {
    cfCol2H = Math.round(cfH * cashGen / netInc);
    cfCol2H = Math.max(0, cfCol2H);
  } else {
    cfCol2H = 0;
  }
  const cfCol2TopOffset = cfCol2H - cfH;
  const col2Top = profitTop - cfCol2TopOffset;

  // ── Col2 内訳 (減価償却 / 税引後利益再掲) 比率厳守: deprH + netH2 = cfCol2H ──
  let deprH;
  if (cashGen > 0 && depr > 0) {
    deprH = Math.round(cfCol2H * depr / cashGen);
    deprH = Math.max(0, Math.min(deprH, cfCol2H));
  } else {
    deprH = 0;
  }
  const netH2 = cfCol2H - deprH;  // 残りが税引後利益再掲

  // ── ラベル表示判定 (ブロックが小さすぎたら inner 非表示) ──
  const taxLabelHidden    = taxH    < LABEL_MIN_H;
  const netLabelHidden    = netH    < LABEL_MIN_H;
  const deprLabelHidden   = deprH   < LABEL_MIN_H;
  const netH2LabelHidden  = netH2   < LABEL_MIN_H;
  const cfGenLabelHidden  = cfCol2H < LABEL_MIN_H;

  // cf-extension-row サイズ
  const COL_GAP = 6;
  const totalCFW = CF_COL_W * 3 + COL_GAP * 2;
  cfRow.style.width  = totalCFW + 'px';
  // 利益セルが小さい場合 CF セルは MIN_CELL_H 制約で下に伸びるため、
  // 実際の Col1 底辺 (profitTop + taxH + netH) を考慮して高さを決定
  const cfCol1Bottom = profitTop + taxH + netH;
  cfRow.style.height = Math.max(PUZZLE_H, cfCol1Bottom) + 'px';

  // 各セルは canvas 相対座標（top:profitTop など）でそのまま配置
  // ※ ヘッダーラベルは canvas 上端に重ねず変動費セルの上に配置（5px のみオフセット）
  const cfHtml = `
    <!-- 控えめなヘッダー（変動費セルの右側、上端） -->
    <div class="cf-section-mini" style="
      position:absolute; top:6px; left:2px; margin:0; z-index:5;
    ">キャッシュフロー生成</div>

    <!-- Col1: 法人税等 -->
    <div class="cf-cell cell-tax" style="
      left:0; top:${profitTop}px;
      width:${CF_COL_W}px; height:${taxH}px;
    " title="法人税等 ${fmt(taxAmt)}">
      ${`<div class="cf-label">法人税等</div><div class="cf-amount">${fmt(taxAmt)}</div>`}
    </div>
    <!-- Col1: 税引後利益 -->
    <div class="cf-cell cell-net-income" style="
      left:0; top:${profitTop + taxH}px;
      width:${CF_COL_W}px; height:${netH}px;
    " title="税引後利益 ${fmtMan(netInc_man)}">
      ${`<div class="cf-label">税引後利益</div><div class="cf-amount">${fmtMan(netInc_man)}</div>`}
    </div>

    <!-- Col2: 減価償却費 -->
    <div class="cf-cell cell-depreciation" style="
      left:${CF_COL_W + COL_GAP}px; top:${col2Top}px;
      width:${CF_COL_W}px; height:${deprH}px;
    " title="減価償却費 ${fmtMan(depr_man)}">
      ${`<div class="cf-label">減価償却費</div><div class="cf-amount">${fmtMan(depr_man)}</div>`}
    </div>
    <!-- Col2: 税引後利益(再掲) -->
    <div class="cf-cell cell-net-income" style="
      left:${CF_COL_W + COL_GAP}px; top:${col2Top + deprH}px;
      width:${CF_COL_W}px; height:${netH2}px;
    " title="税引後利益 ${fmtMan(netInc_man)}">
      ${`<div class="cf-label">税引後利益</div><div class="cf-amount">${fmtMan(netInc_man)}</div>`}
    </div>

    <!-- Col3: CF 生成額 -->
    <div class="cf-cell cell-cash-gen" style="
      left:${CF_COL_W * 2 + COL_GAP * 2}px; top:${col2Top}px;
      width:${CF_COL_W}px; height:${cfCol2H}px;
    " title="CF 生成額 ${fmtMan(cashGen_man)}">
      ${`<div class="cf-label">CF 生成額</div><div class="cf-amount">${fmtMan(cashGen_man)}</div><div class="cf-breakdown" style="font-size:0.72em; color:#555; margin-top:4px; padding-top:3px; border-top:1px dashed rgba(0,0,0,.18); line-height:1.2;">税引後利益 ${fmtMan(netInc_man)}<br>＋ 減価償却 ${fmtMan(depr_man)}</div>`}
    </div>
  `;

  cfRow.innerHTML = '';
  cfRow.innerHTML = cfHtml;
  // 旧 SVG 矢印は出力しない（撤廃）
  puzzleRow.querySelectorAll('.cf-arrow-svg').forEach(el => el.remove());
}

/* ═══════════════════════════════════════════════════════
 * KPI ストリップ HTML 生成
 * ═══════════════════════════════════════════════════════ */
function buildKpiStrip(bp, op_man_adj) {
  const rev  = bp.revenue || 0;
  const gp   = bp.gross_profit || 0;
  const fc   = (bp.personnel_cost || 0) + (bp.other_fixed_cost || 0);
  const op   = bp.profit || 0;
  const netInc  = bp.net_income || 0;
  const depr    = bp.depreciation || 0;
  const cashGen = bp.cash_generation || (netInc + depr);
  const m = bp.metrics || {};

  const gmPct = m.gross_margin_pct != null
    ? m.gross_margin_pct.toFixed(1) + '%'
    : pctStr(gp, rev);
  const opPctOfRev = rev > 0 ? (op / rev * 100).toFixed(1) + '%' : '—';
  const fcRatio = gp > 0 ? (fc / gp * 100).toFixed(1) + '%' : '—';
  const cfPctOfRev = rev > 0 ? (cashGen / rev * 100).toFixed(1) + '%' : '—';

  return `
    <div class="kpi-strip">
      <div class="kpi-card kpi-revenue">
        <div class="kpi-label">売上高</div>
        <div class="kpi-value">${fmt(rev)}</div>
        <div class="kpi-sub">月平均 約 <strong>${fmt(rev / 12)}</strong></div>
      </div>
      <div class="kpi-card kpi-gross">
        <div class="kpi-label">粗利</div>
        <div class="kpi-value">${fmt(gp)}</div>
        <div class="kpi-sub">粗利率 <strong>${gmPct}</strong></div>
      </div>
      <div class="kpi-card kpi-profit">
        <div class="kpi-label">経常利益</div>
        <div class="kpi-value">${fmt(op)}</div>
        <div class="kpi-sub">売上比 <strong>${opPctOfRev}</strong> ・ 固定費比 <strong>${fcRatio}</strong></div>
      </div>
      <div class="kpi-card kpi-cash">
        <div class="kpi-label">CF 生成額</div>
        <div class="kpi-value">${fmt(cashGen)}</div>
        <div class="kpi-sub">売上比 <strong>${cfPctOfRev}</strong></div>
      </div>
    </div>
  `;
}

/* ═══════════════════════════════════════════════════════
 * ブロックパズル描画
 * ═══════════════════════════════════════════════════════ */
function buildPuzzle(bp) {
  const rev  = bp.revenue          || 0;
  const vc   = bp.variable_cost    || 0;
  const gp   = bp.gross_profit     || 0;
  const fc   = (bp.personnel_cost || 0) + (bp.other_fixed_cost || 0);
  const pc   = bp.personnel_cost   || 0;
  const ofc  = bp.other_fixed_cost || 0;
  const op   = bp.profit           || 0;
  const m    = bp.metrics          || {};

  const hqAlloc       = bp._hq_allocation || null;
  const isCluster     = !!hqAlloc;
  const hqFixed       = hqAlloc ? (hqAlloc.hq_cost_allocated || 0) : 0;
  const hqPersonnel   = hqAlloc ? (hqAlloc.personnel_hq      || 0) : 0;
  const hqOtherFixed  = hqAlloc ? (hqAlloc.other_fixed_hq    || 0) : 0;
  const hqFixed_man      = Math.round(hqFixed      / 10_000);
  const hqPersonnel_man  = Math.round(hqPersonnel  / 10_000);
  const hqOtherFixed_man = Math.round(hqOtherFixed / 10_000);

  /* ── キャンバスサイズ ── */
  const PUZZLE_H = 540;
  const MIN_ROW  = 48;

  /* ── 縦分割 ── */
  const vcH_raw = rev > 0 ? vc / rev * PUZZLE_H : PUZZLE_H / 3;
  const vcH  = clamp(Math.round(vcH_raw), MIN_ROW, PUZZLE_H - 2 * MIN_ROW);
  const gpH  = PUZZLE_H - vcH;

  const MIN_PROFIT = 56;
  // 赤字判定は画面の万円表示（利益 = 粗利万円 − 固定費万円）とそろえる
  const isLoss = (toMan(gp) - toMan(fc)) < 0;
  let opH, subH, lossH = 0;
  if (!isLoss) {
    const opH_raw = rev > 0 ? op / rev * PUZZLE_H : gpH / 6;
    opH  = clamp(Math.round(opH_raw), MIN_PROFIT, gpH - 2 * MIN_ROW);
    subH = gpH - opH;
  } else {
    // 赤字: 赤字ブロックを粗利の下へはみ出させ、固定費の列 = 粗利 + 赤字 の高さにする
    // （縦の縮尺は売上・変動費・粗利と同じ。最小 MIN_PROFIT・最大 PUZZLE_H / 2 で抑える。
    //   最大で抑えた期は縮尺どおりではない — 金額はラベルで示す）
    const lossH_raw = rev > 0 ? -op / rev * PUZZLE_H : MIN_PROFIT;
    lossH = clamp(Math.round(lossH_raw), MIN_PROFIT, Math.round(PUZZLE_H / 2));
    opH  = lossH;
    subH = gpH + lossH;
  }
  const CANVAS_H = PUZZLE_H + lossH;
  const personnelH = fc > 0
    ? clamp(Math.round(subH * pc / fc), 24, subH - 24)
    : Math.round(subH / 2);
  const otherH = subH - personnelH;

  /* ── 横分割 ── */
  const SALES_PCT = 28;
  const rightPct  = 100 - SALES_PCT;

  const totalRight = gp + fc;
  const grossPct   = totalRight > 0 ? (gp / totalRight * rightPct) : rightPct * 0.5;
  const fixedPct   = rightPct - grossPct;

  const FIXED_LABEL_RATIO = 0.40;
  const fixedLabelPct = fixedPct * FIXED_LABEL_RATIO;
  const fixedSubPct   = fixedPct * (1 - FIXED_LABEL_RATIO);

  const grossLeft     = SALES_PCT;
  const fixedLabelLeft = SALES_PCT + grossPct;
  const fixedSubLeft  = SALES_PCT + grossPct + fixedLabelPct;

  /* ── 万円表示の整合性 ── */
  const rev_man  = toMan(rev);
  const gp_man   = toMan(gp);
  const fc_man   = toMan(fc);
  const pc_man   = toMan(pc);
  const vc_man   = rev_man - gp_man;
  const ofc_man  = fc_man - pc_man;
  const op_man_adj = gp_man - fc_man;

  /* ── メトリクス ── */
  const grossMarginStr = m.gross_margin_pct != null
    ? m.gross_margin_pct.toFixed(1) + '%'
    : pctStr(gp, rev);
  const laborShareStr = m.labor_share_pct != null
    ? m.labor_share_pct.toFixed(1) + '%'
    : pctStr(pc, gp);

  const INNER_BORDER = '1px solid rgba(15, 23, 42, 0.06)';

  const html = `
    <div class="puzzle-row-wrap">
    <div class="puzzle-row">
      <div id="puzzle-canvas" style="height:${CANVAS_H}px; position:relative; overflow:hidden;">

        <!-- ① 売上高 -->
        <div class="bp-cell cell-revenue" style="
          left:0; top:0;
          width:${SALES_PCT}%; height:${PUZZLE_H}px;
          border-right:${INNER_BORDER};
        ">
          <div class="cell-label">売上高</div>
          <div class="cell-amount">${fmtMan(rev_man)}</div>
        </div>

        <!-- ② 変動費 -->
        <div class="bp-cell cell-variable" style="
          left:${SALES_PCT}%; top:0;
          width:${rightPct.toFixed(3)}%; height:${vcH}px;
          border-bottom:${INNER_BORDER};
        ">
          <div class="cell-label">変動費</div>
          <div class="cell-amount">${fmtMan(vc_man)}</div>
        </div>

        <!-- ③ 粗利 -->
        <div class="bp-cell cell-gross" style="
          left:${grossLeft.toFixed(3)}%; top:${vcH}px;
          width:${grossPct.toFixed(3)}%; height:${gpH}px;
          border-right:${INNER_BORDER};
        ">
          <div class="cell-label">粗利</div>
          <div class="cell-amount">${fmtMan(gp_man)}</div>
        </div>

        <!-- ④ 固定費ラベル列 -->
        <div class="bp-cell cell-fixed" style="
          left:${fixedLabelLeft.toFixed(3)}%; top:${vcH}px;
          width:${fixedLabelPct.toFixed(3)}%; height:${subH}px;
          border-right:${INNER_BORDER};
          border-bottom: 1px solid rgba(15, 23, 42, 0.06);
        ">
          ${isCluster && hqFixed_man > 0 ? (() => {
            const hqPct = fc_man > 0 ? hqFixed_man / fc_man : 0;
            const overlayH = Math.round(subH * hqPct);
            const minOverlayH = overlayH < 28 ? 28 : overlayH;
            return `<div class="hq-overlay" style="height:${minOverlayH}px; top:0;">
              <div class="hq-overlay-top" style="height:100%;">
                <div class="hq-overlay-label">本社経費</div>
                <div class="hq-overlay-pct">${(hqPct*100).toFixed(1)}%</div>
              </div>
            </div>`;
          })() : ''}
          <div class="cell-label" style="position:relative; z-index:5;">固定費</div>
          <div class="cell-amount" style="position:relative; z-index:5;">${fmtMan(fc_man)}</div>
        </div>

        <!-- ⑤ 人件費 -->
        <div class="bp-cell cell-personnel" style="
          left:${fixedSubLeft.toFixed(3)}%; top:${vcH}px;
          width:${fixedSubPct.toFixed(3)}%; height:${personnelH}px;
          border-bottom:${INNER_BORDER};
        ">
          ${isCluster && hqPersonnel_man > 0 ? (() => {
            const hqPct = pc_man > 0 ? hqPersonnel_man / pc_man : 0;
            const overlayH = Math.round(personnelH * hqPct);
            const minOverlayH = overlayH < 28 ? 28 : overlayH;
            return `<div class="hq-overlay" style="height:${minOverlayH}px; top:0;">
              <div class="hq-overlay-top" style="height:100%;">
                <div class="hq-overlay-label">本社経費</div>
                <div class="hq-overlay-pct">${(hqPct*100).toFixed(1)}%</div>
              </div>
            </div>`;
          })() : ''}
          <div class="cell-label" style="position:relative; z-index:5;">人件費</div>
          <div class="cell-amount" style="position:relative; z-index:5;">${fmtMan(pc_man)}</div>
        </div>

        <!-- ⑥ その他固定費 -->
        <div class="bp-cell cell-other" style="
          left:${fixedSubLeft.toFixed(3)}%; top:${vcH + personnelH}px;
          width:${fixedSubPct.toFixed(3)}%; height:${otherH}px;
          border-bottom: 1px solid rgba(15, 23, 42, 0.06);
        ">
          ${isCluster && hqOtherFixed_man > 0 ? (() => {
            const hqPct = ofc_man > 0 ? hqOtherFixed_man / ofc_man : 0;
            const overlayH = Math.round(otherH * hqPct);
            const minOverlayH = overlayH < 28 ? 28 : overlayH;
            return `<div class="hq-overlay" style="height:${minOverlayH}px; top:0;">
              <div class="hq-overlay-top" style="height:100%;">
                <div class="hq-overlay-label">本社経費</div>
                <div class="hq-overlay-pct">${(hqPct*100).toFixed(1)}%</div>
              </div>
            </div>`;
          })() : ''}
          <div class="cell-label" style="font-size:0.78rem; position:relative; z-index:5;">その他固定費</div>
          <div class="cell-amount" style="position:relative; z-index:5;">${fmtMan(ofc_man)}</div>
        </div>

        <!-- ⑦ 利益（赤字の期は粗利の下へはみ出す「赤字」ブロック。赤文字・赤枠） -->
        <div class="bp-cell cell-profit${isLoss ? ' is-loss' : ''}" style="
          left:${(isLoss ? grossLeft : fixedLabelLeft).toFixed(3)}%; top:${isLoss ? vcH + gpH : vcH + subH}px;
          width:${(isLoss ? grossPct : fixedPct).toFixed(3)}%; height:${opH}px;
        ">
          <div class="cell-label">${isLoss ? '赤字' : '利益'}</div>
          <div class="cell-amount">${fmtMan(op_man_adj)}</div>
        </div>

        <!-- ⑧ 粗利率タグ（粗利セル右下） -->
        <div class="inline-tag" id="tag-gm" data-anchor=".cell-gross" style="
          left:${(grossLeft + grossPct - 1).toFixed(2)}%;
          top:${PUZZLE_H - 32}px;
          transform:translateX(-100%);
        ">
          <span class="tag-label">粗利率</span>
          <span class="tag-value">${grossMarginStr}</span>
        </div>

        <!-- ⑨ 労働分配率タグ（人件費セル右下、HQ オーバーレイと干渉しない位置） -->
        <div class="inline-tag" id="tag-ls" data-anchor=".cell-personnel" style="
          left:${(fixedSubLeft + fixedSubPct - 1).toFixed(2)}%;
          top:${vcH + personnelH - 32}px;
          transform:translateX(-100%);
        ">
          <span class="tag-label">労働分配率</span>
          <span class="tag-value">${laborShareStr}</span>
        </div>

      </div><!-- /#puzzle-canvas -->
      <!-- CF 拡張エリア -->
      <div id="cf-extension-row" style="height:${CANVAS_H}px; position:relative;"></div>
    </div><!-- /.puzzle-row -->
    </div><!-- /.puzzle-row-wrap -->
  `;

  return {
    html,
    layout: { vcH, gpH, opH, subH, otherH, personnelH, PUZZLE_H, CANVAS_H, isLoss,
              fixedSubLeft, fixedSubPct, SALES_PCT, grossPct, fixedLabelPct,
              op_man_adj }
  };
}

/* ═══════════════════════════════════════════════════════
 * 内訳テーブル
 * ═══════════════════════════════════════════════════════ */
function renderBreakdownItems(items, total) {
  if (!items || !items.length)
    return '<div class="breakdown-item"><span class="item-name">データなし</span></div>';
  return items.map(item => `
    <div class="breakdown-item">
      <span class="item-name">${escHtml(item.name)}</span>
      <span class="item-amount">${fmt(item.value)}</span>
      <span class="item-pct">${pctStr(item.value, total)}</span>
    </div>`).join('');
}

/* ═══════════════════════════════════════════════════════
 * 配賦注記の更新
 * ═══════════════════════════════════════════════════════ */
function updateAllocationNote(selectVal, bp) {
  const noteEl = document.getElementById('cluster-allocation-note');
  if (!noteEl) return;

  if (!selectVal || !selectVal.startsWith('cluster:')) {
    noteEl.style.display = 'none';
    return;
  }

  const clusterName = selectVal.slice('cluster:'.length);
  const hqAlloc = bp && bp._hq_allocation;
  const hqTotal = hqAlloc ? hqAlloc.hq_cost_total : null;
  const hqRatio = clusterName === '工事部' ? 60 : 40;

  let hqAmountStr;
  if (hqTotal != null && hqTotal > 0) {
    const hqMan = Math.round(hqTotal / 10_000);
    hqAmountStr = `約 ${hqMan.toLocaleString()} 万円`;
  } else {
    hqAmountStr = '推定値';
  }

  // standalone は仕訳の部門の実数（_source: dept_journals）。server.py の表示は従来どおり売上比率の推定
  noteEl.textContent = (bp && bp._source === 'dept_journals')
    ? `部門表示: MF の仕訳に付いた部門で集計した実数に、本部経費（本部 + その他「総務部」 ${hqAmountStr}）の ${hqRatio}% を${clusterName}に配賦`
    : `クラスタ表示: 本社経費（本部 + その他「総務部」推定 ${hqAmountStr}）の ${hqRatio}% を${clusterName}に配賦`;
  noteEl.style.display = 'block';
}

/* ═══════════════════════════════════════════════════════
 * メイン描画
 * ═══════════════════════════════════════════════════════ */
function render(bp, commentary) {
  const rev = bp.revenue          || 0;
  const vc  = bp.variable_cost    || 0;
  const gp  = bp.gross_profit     || 0;
  const pc  = bp.personnel_cost   || 0;
  const ofc = bp.other_fixed_cost || 0;

  const period = bp.period || {};
  const periodStr = period.start && period.end
    ? `${period.start} 〜 ${period.end}`
    : '期間不明';
  document.getElementById('period-label').textContent = periodStr;

  const { html: puzzleHtml, layout } = buildPuzzle(bp);
  const kpiHtml = buildKpiStrip(bp, layout.op_man_adj);

  // 印刷倍率: 赤字ブロックでキャンバスが高くなった期は、印刷上の高さが黒字の期
  //（CANVAS_H = 540・倍率 0.6）を超えないよう比例して縮め、A4 2枚に収める
  const PRINT_FIT_H = 540;
  const printZoom = layout.CANVAS_H > PRINT_FIT_H ? (0.6 * PRINT_FIT_H / layout.CANVAS_H).toFixed(3) : '0.6';

  const html = `
    ${kpiHtml}

    <div class="puzzle-card" style="--print-zoom:${printZoom};">
      <div class="card-head">
        <h2>お金のブロックパズル</h2>
        <span class="head-sub">和仁達也方式 ・ 経常利益ベース</span>
      </div>

      <div class="formula-row">
        <span class="formula-chip">売上 ＝ 変動費 ＋ <span class="em" style="color:var(--green-700);">粗利</span></span>
        <span class="formula-divider"></span>
        <span class="formula-chip"><span class="em" style="color:var(--green-700);">粗利</span> ＝ <span class="em" style="color:var(--warn-700);">固定費</span> ＋ <span class="em" style="color:var(--gold-700);">利益</span></span>
        <span class="formula-divider"></span>
        <span class="formula-chip"><span class="em" style="color:var(--warn-700);">固定費</span> ＝ 人件費 ＋ その他固定費</span>
        <span class="formula-divider"></span>
        <span class="formula-chip"><span class="em" style="color:var(--gold-700);">利益</span> − 法人税${(bp.special_items || 0) !== 0 ? ' ＋ 特別損益' : ''} ＝ 税引後利益</span>
        <span class="formula-divider"></span>
        <span class="formula-chip">税引後利益 ＋ 減価償却費 ＝ CF生成額</span>
      </div>

      <div class="formula-note">
        ※「利益」は経常利益、「固定費」は販管費から営業外損益を吸収した実質固定費（和仁達也方式準拠）
      </div>

      <div id="cluster-allocation-note"></div>

      ${puzzleHtml}
    </div>

    <div class="commentary-card">
      <h2>AI 簡易分析</h2>
      <div id="commentary-text"></div>
    </div>

    <div class="breakdown-section">
      <details>
        <summary>勘定科目分類（ブロックパズル基準）</summary>
        <div class="breakdown-inner">
          <div class="breakdown-grid">
            <div class="breakdown-col">
              <h3>売上高内訳</h3>
              ${renderBreakdownItems(bp.revenue_breakdown, rev)}
            </div>
            <div class="breakdown-col">
              <h3>変動費内訳</h3>
              ${renderBreakdownItems(bp.variable_breakdown, vc)}
            </div>
            <div class="breakdown-col">
              <h3>人件費内訳</h3>
              ${renderBreakdownItems(bp.personnel_breakdown, pc)}
            </div>
            <div class="breakdown-col">
              <h3>その他固定費 上位 10 科目</h3>
              ${renderBreakdownItems((bp.other_fixed_breakdown || []).slice(0, 10), ofc)}
            </div>
          </div>
        </div>
      </details>
    </div>
  `;

  document.getElementById('main-content').innerHTML = html;
  // AI コメントは HTML として解釈させない（文字として入れる。改行は CSS の pre-wrap で保つ）
  document.getElementById('commentary-text').textContent = commentary || '';

  updateAllocationNote(_currentSelectVal, bp);

  requestAnimationFrame(() => {
    renderCFExtension(bp, layout);
    requestAnimationFrame(() => {
      if (window.__autoLayoutLabels) window.__autoLayoutLabels();
    });
  });
}

/* ═══════════════════════════════════════════════════════
 * 自動レイアウト
 *   描画後に実際の矩形を測り、
 *     ① 本社経費バンドを避けてセル内容を寄せる
 *     ② それでもセルからはみ出す内容はピルとして外へ出す
 *     ③ ピル・インラインタグを空いている場所へ逃がす
 *     ④ 移動したものは引き出し線で元のセルへ結ぶ
 *   …を行う。しきい値をベタ書きせず、重なりは実測で判定する。
 * ═══════════════════════════════════════════════════════ */
(function () {
  const SVGNS = 'http://www.w3.org/2000/svg';
  const OBSTACLES =
    '.cell-label,.cell-amount,.cf-label,.cf-amount,.cf-breakdown,' +
    '.hq-overlay-label,.hq-overlay-pct,.cf-section-mini';
  const PAD  = 3;     // 重なり判定の余白
  const GAP  = 10;    // ピルとセルの隙間
  const LINE = 'rgba(100,116,139,.8)';

  const hit = (a, b, p) =>
    !(a.r <= b.l - p || a.l >= b.r + p || a.b <= b.t - p || a.t >= b.b + p);

  /* 候補オフセット：近い順。上方向はやや不利にして「下へ逃がす」を優先 */
  const OFFSETS = (() => {
    const o = [];
    for (let ry = 0; ry <= 18; ry++) {
      for (let rx = 0; rx <= 14; rx++) {
        for (const sy of (ry ? [1, -1] : [0])) {
          for (const sx of (rx ? [1, -1] : [0])) {
            const dx = sx * rx * 9, dy = sy * ry * 7;
            o.push([dx, dy, Math.abs(dx) * 1.2 + (dy > 0 ? dy : -dy * 1.3)]);
          }
        }
      }
    }
    o.sort((a, b) => a[2] - b[2]);
    return o;
  })();

  function unionRect(els) {
    let l = Infinity, t = Infinity, r = -Infinity, b = -Infinity;
    els.forEach(e => {
      const q = e.getBoundingClientRect();
      l = Math.min(l, q.left); t = Math.min(t, q.top);
      r = Math.max(r, q.right); b = Math.max(b, q.bottom);
    });
    return { left: l, top: t, right: r, bottom: b };
  }

  /* 引き出し線の始点・終点（ピル外周 → セル外周の最近点） */
  function leaderEnds(rect, cell) {
    const fcx = (rect.l + rect.r) / 2, fcy = (rect.t + rect.b) / 2;
    const ax = Math.max(cell.l + 2, Math.min(fcx, cell.r - 2));
    const ay = Math.max(cell.t + 2, Math.min(fcy, cell.b - 2));
    return { sx: Math.max(rect.l, Math.min(ax, rect.r)),
             sy: Math.max(rect.t, Math.min(ay, rect.b)), ax: ax, ay: ay };
  }

  /* 引き出し線が横切ってしまうラベルの数 */
  function crossings(rect, cell, obst) {
    const e = leaderEnds(rect, cell);
    const len = Math.hypot(e.ax - e.sx, e.ay - e.sy);
    if (len < 6) return 0;
    const n = Math.min(48, Math.max(6, Math.round(len / 4)));
    let cnt = 0;
    obst.forEach(o => {
      for (let i = 1; i < n; i++) {
        const t = i / n;
        const px = e.sx + (e.ax - e.sx) * t, py = e.sy + (e.ay - e.sy) * t;
        if (px >= o.l - 1 && px <= o.r + 1 && py >= o.t - 1 && py <= o.b + 1) {
          cnt++; return;
        }
      }
    });
    return cnt;
  }

  const hide = els => els.forEach(e => {
    e.style.display = 'none';
    e.setAttribute('data-auto-hidden', '1');
  });

  function resolve(cont) {
    const cr = cont.getBoundingClientRect();
    if (!cr.width || !cr.height) return;
    const W = cr.width, H = cr.height;
    const rel = q => ({ l: q.left - cr.left, t: q.top - cr.top,
                        r: q.right - cr.left, b: q.bottom - cr.top });
    const floats = [];

    /* ── ① / ② セル内容 ── */
    cont.querySelectorAll('.bp-cell, .cf-cell, .fixed-sub-cell').forEach(cell => {
      const kids = Array.prototype.filter.call(
        cell.children, k => !k.classList.contains('hq-overlay'));
      if (!kids.length) return;
      const cellR = cell.getBoundingClientRect();
      if (cellR.height < 3 || cellR.width < 3) { hide(kids); return; }

      /* 本社経費バンドの下へ寄せる（セルからはみ出さない範囲で目一杯） */
      const band = cell.querySelector('.hq-overlay');
      let bandTexts = [];
      if (band) {
        bandTexts = Array.prototype.slice
          .call(band.querySelectorAll('.hq-overlay-label,.hq-overlay-pct'))
          .map(e => {
            const q = e.getBoundingClientRect();
            return { l: q.left, t: q.top, r: q.right, b: q.bottom };
          });
        const bR = band.getBoundingClientRect();
        const u0 = unionRect(kids);
        const want = ((bR.bottom + 2) + (cellR.bottom - 2)) / 2 - (u0.top + u0.bottom) / 2;
        const room = (cellR.bottom - 1) - u0.bottom;
        const d = Math.min(want, room);
        if (d > 0.5) {
          kids.forEach(k => {
            k.style.transform = 'translateY(' + d.toFixed(1) + 'px)';
            k.setAttribute('data-auto-shift', '1');
          });
        }
      }

      /* flex で押し潰された分も見るため、内容の「本来の高さ」で判定する */
      let need = 0, ellipsis = false;
      kids.forEach(k => {
        const cs = getComputedStyle(k);
        need += k.scrollHeight + (parseFloat(cs.marginTop) || 0)
                               + (parseFloat(cs.marginBottom) || 0);
        if (k.scrollWidth > k.clientWidth + 1) ellipsis = true;
      });
      const cc = getComputedStyle(cell);
      const avail = cellR.height - (parseFloat(cc.paddingTop) || 0)
                                 - (parseFloat(cc.paddingBottom) || 0);

      const u = unionRect(kids);
      const uu = { l: u.left, t: u.top, r: u.right, b: u.bottom };
      const over = need > avail + 0.5 || ellipsis ||
                   u.top    < cellR.top    - 0.5 || u.bottom > cellR.bottom + 0.5 ||
                   u.left   < cellR.left   - 0.5 || u.right  > cellR.right  + 0.5;
      const clash = bandTexts.some(b => hit(uu, b, 2));
      if (!over && !clash) return;

      const pill = document.createElement('div');
      pill.className = 'auto-out';
      kids.forEach(k => {
        const c = k.cloneNode(true);
        c.style.position = '';
        c.style.transform = '';
        c.style.color = getComputedStyle(k).color;
        pill.appendChild(c);
      });
      hide(kids);
      pill.style.left = '0px';
      pill.style.top = '0px';
      pill.style.visibility = 'hidden';
      cont.appendChild(pill);
      floats.push({ el: pill, cell: rel(cellR), pill: true });
    });

    /* ── インラインタグ ── */
    cont.querySelectorAll('.inline-tag').forEach(tag => {
      const sel = tag.getAttribute('data-anchor');
      const src = sel ? cont.querySelector(sel) : null;
      floats.push({ el: tag, cell: src ? rel(src.getBoundingClientRect()) : null,
                    pill: false });
    });
    if (!floats.length) return;

    /* ── ③ 障害物を集めて配置 ── */
    const obst = Array.prototype.slice
      .call(cont.querySelectorAll(OBSTACLES))
      .filter(e => !e.closest('.auto-out') && !e.hasAttribute('data-auto-hidden'))
      .map(e => rel(e.getBoundingClientRect()));

    const taken = [];
    floats.forEach(f => {
      const el = f.el;
      const r0 = rel(el.getBoundingClientRect());   // transform 適用後の実位置
      const w = r0.r - r0.l, h = r0.b - r0.t;
      el.style.transform = 'none';
      let x = r0.l, y = r0.t;
      if (f.pill && f.cell) {                        // ピルの初期位置はセルの真上
        x = (f.cell.l + f.cell.r) / 2 - w / 2;
        y = f.cell.t - GAP - h;
        if (y < 1) y = f.cell.b + GAP;
      }
      /* 空いている候補を近い順に集める */
      const cands = [];
      for (let i = 0; i < OFFSETS.length && cands.length < 60; i++) {
        const c = { l: x + OFFSETS[i][0], t: y + OFFSETS[i][1] };
        c.r = c.l + w; c.b = c.t + h;
        if (c.l < 1 || c.t < 1 || c.r > W - 1 || c.b > H - 1) continue;
        if (obst.some(o => hit(c, o, PAD)))  continue;
        if (taken.some(o => hit(c, o, PAD))) continue;
        cands.push([c, OFFSETS[i][2]]);
      }
      /* 近さ＋「引き出し線が他のラベルを横切らないこと」で選ぶ */
      let best = null, bestScore = Infinity;
      for (let i = 0; i < cands.length; i++) {
        const sc = cands[i][1] +
                   (f.cell ? 26 * crossings(cands[i][0], f.cell, obst) : 0);
        if (sc < bestScore) { bestScore = sc; best = cands[i][0]; }
      }
      if (!best) best = { l: x, t: y, r: x + w, b: y + h };
      el.style.left = best.l.toFixed(1) + 'px';
      el.style.top  = best.t.toFixed(1) + 'px';
      el.style.visibility = '';
      taken.push(best);
      f.rect  = best;
      f.moved = Math.abs(best.l - r0.l) > 1 || Math.abs(best.t - r0.t) > 1;
    });

    /* ── ④ 引き出し線 ── */
    const svg = document.createElementNS(SVGNS, 'svg');
    svg.setAttribute('class', 'auto-svg');
    svg.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;' +
                        'pointer-events:none;z-index:28;overflow:visible';
    let drawn = 0;
    floats.forEach(f => {
      if (!f.cell || (!f.pill && !f.moved)) return;
      const e = leaderEnds(f.rect, f.cell);
      const sx = e.sx, sy = e.sy, ax = e.ax, ay = e.ay;
      if (Math.hypot(ax - sx, ay - sy) < 6) return;
      const ln = document.createElementNS(SVGNS, 'line');
      ln.setAttribute('x1', sx.toFixed(1)); ln.setAttribute('y1', sy.toFixed(1));
      ln.setAttribute('x2', ax.toFixed(1)); ln.setAttribute('y2', ay.toFixed(1));
      ln.setAttribute('stroke', LINE);
      ln.setAttribute('stroke-width', '1');
      ln.setAttribute('stroke-dasharray', '3 3');
      const dot = document.createElementNS(SVGNS, 'circle');
      dot.setAttribute('cx', ax.toFixed(1)); dot.setAttribute('cy', ay.toFixed(1));
      dot.setAttribute('r', '2.5'); dot.setAttribute('fill', LINE);
      svg.appendChild(ln); svg.appendChild(dot); drawn++;
    });
    if (drawn) cont.appendChild(svg);
  }

  window.__autoLayoutLabels = function () {
    const wrap = document.querySelector('.puzzle-row-wrap');
    if (!wrap) return;
    wrap.querySelectorAll('.auto-out, .auto-svg').forEach(e => e.remove());
    wrap.querySelectorAll('[data-auto-hidden]').forEach(e => {
      e.style.display = ''; e.removeAttribute('data-auto-hidden');
    });
    wrap.querySelectorAll('[data-auto-shift]').forEach(e => {
      e.style.transform = ''; e.removeAttribute('data-auto-shift');
    });
    ['#puzzle-canvas', '#cf-extension-row'].forEach(sel => {
      const c = wrap.querySelector(sel);
      if (c) { try { resolve(c); } catch (err) { console.warn('autoLayout', err); } }
    });
  };
})();

// ── 通年推移（standalone 専用）──────────────────────────────
// var: 初回表示の IIFE がこの行より先に loadData を呼ぶため（const だと TDZ で ReferenceError）
var TREND_KEY = 'trend';

// 通年推移の対象: 当期（current_year_key）を除き、データのある期を古い順に
// （通年推移は全期をまとめて見るカードなので全期を使う。期ごとの AI コメントはその期までしか使わない＝_trend_upto）
function trendYears() {
  const all = window.__EMBEDDED_DATA__;
  if (!all || !Array.isArray(all.fiscal_years)) return [];
  const cur = all.current_year_key || all.default_year_key;
  return all.fiscal_years
    .filter(f => f.year_key !== cur && f.data_available)
    .slice()
    .sort((a, b) => a.fiscal_year - b.fiscal_year);
}

// 1 期分の万円値。ブロック図と同じ計算（固定費 = 人件費 + その他固定費、利益 = 粗利万円 − 固定費万円）
function trendValues(bp) {
  const rev = toMan(bp.revenue || 0);
  const gp  = toMan(bp.gross_profit || 0);
  const fc  = toMan((bp.personnel_cost || 0) + (bp.other_fixed_cost || 0));
  return { rev, gp, fc, op: gp - fc };
}

// 「11〜14期」のような期間の呼び名（fiscal_year は 6 月始まりの開始年。N期 = fiscal_year - 2010）。
// 途中に飛ばした期がある時は「13・15期」のように並べる
function trendSpanLabel(rows) {
  const ns = rows.map(r => r.f.fiscal_year - 2010);
  if (ns.length === 1) return `${ns[0]}期`;
  const contiguous = ns.every((n, i) => i === 0 || n === ns[i - 1] + 1);
  return contiguous ? `${ns[0]}〜${ns[ns.length - 1]}期` : `${ns.join('・')}期`;
}

// 結論 1 行: 赤字（固定費 > 粗利）／黒字（粗利 ≧ 固定費）の続いた期間ごとに文を作る。
// rows に missing（部門の入力なし）の年があれば、その年は飛ばして判定し、最後に除いたことを書く
function trendConclusion(allRows, fcName = '固定費') {
  const rows = allRows.filter(r => !r.missing);
  const skipped = allRows.filter(r => r.missing);
  const tail = skipped.length ? `（${trendSpanLabel(skipped)}は部門の入力がないため除く）` : '';
  if (!rows.length) return tail;
  const isLoss = r => r.v.op < 0;
  const man = v => v.toLocaleString() + '万円';
  if (rows.length > 1 && rows.every(isLoss)) {
    const d = rows.map(r => -r.v.op);
    return `${rows.length}期とも${fcName}が粗利を上回り赤字。差は${man(d[0])}→${man(d[d.length - 1])}。` + tail;
  }
  if (rows.length > 1 && !rows.some(isLoss)) {
    const d = rows.map(r => r.v.op);
    return `${rows.length}期とも粗利が${fcName}を上回り黒字。黒字の幅は+${man(d[0])}→+${man(d[d.length - 1])}。` + tail;
  }
  // 赤字・黒字の続いた区間に分ける。部門の入力がない年をまたぐ所では区間を切る
  const runs = [];
  let gap = false;
  allRows.forEach(r => {
    if (r.missing) { gap = true; return; }
    const last = runs[runs.length - 1];
    if (last && !gap && isLoss(last[0]) === isLoss(r)) last.push(r);
    else { const nr = [r]; nr.afterGap = gap && runs.length > 0; runs.push(nr); }
    gap = false;
  });
  let seenProfit = false, seenLoss = false;
  return runs.map((run, i) => {
    const L = trendSpanLabel(run);
    const one = run.length === 1;
    // 入力なしの年をはさんで前の区間と同じ赤字/黒字が続く時は「〜も赤字／も黒字」
    const same = i > 0 && run.afterGap && isLoss(runs[i - 1][0]) === isLoss(run[0]);
    if (isLoss(run[0])) {
      const d = run.map(r => -r.v.op);
      const amt = one ? `（-${man(d[0])}）` : `（差 ${man(d[0])}→${man(d[d.length - 1])}）`;
      const firstLoss = !seenLoss; seenLoss = true;
      if (same) return `${L}も赤字${amt}`;
      return i === 0 ? `${L}は${fcName}が粗利を上回って赤字${one ? amt : ''}`
                     : `${L}${one ? 'に' : 'は'}${firstLoss ? '初めて' : '再び'}${fcName}が上回り赤字${amt}`;
    }
    const d = run.map(r => r.v.op);
    const amt = one ? `（+${man(d[0])}）` : `（+${man(d[0])}→+${man(d[d.length - 1])}）`;
    const first = !seenProfit; seenProfit = true;
    if (same) return `${L}も黒字${amt}`;
    if (i === 0) return `${L}は粗利が${fcName}を上回り黒字${amt}`;
    return `${L}${one ? 'に' : 'は'}${first ? '初めて' : '再び'}粗利が上回り黒字${amt}`;
  }).join('。') + '。' + tail;
}

// 通年推移タブ内での表示名（ブロック図・部門ボタンの名前は変えない）
const TREND_NAME = { '全社合計': '全社合計', '工事部': '工事部', '事業開発部': 'DC（就労移行支援）' };
// 部門ボタンの名前 → 埋め込みデータ（dept_years）の区分名
const TREND_GROUP = { '工事部': '工事部', '事業開発部': 'DC' };

// 「本部経費を入れる」切替（工事部・DC の 2 枚に共通。既定は入れない）
var __trendHq = false;
function toggleTrendHq() {

// 仕訳の部門から集計した実数（build 時に tools/mf-dept-pl の cache から作って埋め込む）。無ければ null
function trendDept() {
  const all = window.__EMBEDDED_DATA__;
  return (all && all.dept_years && all.dept_years.years) ? all.dept_years : null;
}

// 指定区分の完了期の行（古い順）。全社はブロックパズルの数字、部門は仕訳の部門からの実数。
// 部門の入力がない期（部門なしの売上が全社売上の 5% 超）は missing として残す（線を途切れさせる）
function trendRows(key) {
  if (key === '全社合計') {
    return trendYears().filter(f => f[key] && f[key].bp).map(f => ({ f, v: trendValues(f[key].bp) }));
  }
  const dy = trendDept();
  if (!dy) return [];
  const g = TREND_GROUP[key] + (__trendHq ? '_本部経費込み' : '');
  return trendYears().filter(f => dy.years[f.year_key]).map(f => {
    const e = dy.years[f.year_key];
    const x = e.groups[g];
    // 経常利益は円を万円にしたもの、固定費は 粗利 − 経常利益（表と下の本部経費の表が同じ数字になるように）
    const rev = toMan(x.sales), gp = toMan(x.gross_profit), op = toMan(x.ordinary_profit);
    return { f, v: { rev, gp, fc: gp - op, op }, missing: !e.dept_available };
  });
}

// 縦軸の目盛り（missing の年は除く）
function trendScale(rowsList) {
  const vals = rowsList.flat().filter(r => !r.missing).flatMap(r => [r.v.gp, r.v.fc]);
  const vMax = Math.max(...vals), vMin = Math.min(...vals);
  const rawStep = Math.max(1, (vMax - vMin) / 4);
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const step = [1, 2, 5, 10].map(m => m * mag).find(s => s >= rawStep);
  const top = Math.ceil(vMax / step) * step + (vMax % step === 0 ? step : 0);
  const bot = Math.max(0, Math.floor(vMin / step) * step - step);
  return { top, bot, step };
}

// カードごとの呼び名
function trendTerms(key) {
  if (key === '全社合計') {
    return { fc: '固定費', fcShort: '固定費', op: '経常利益', sub: '',
             note: '※ 数字はブロック図と同じ計算（固定費 = 人件費 + その他固定費、経常利益 = 粗利 − 固定費、万円単位）。期のボタンで各期のブロック図に戻れます。' };
  }
  const r = trendDept().hq_allocation;
  const pct = Math.round(r[key] * 100);
  return __trendHq
    ? { fc: '固定費（本部経費の配賦を含む）', fcShort: '固定費', op: '経常利益（本部経費の配賦後）',
        sub: `仕訳の部門から集計・本部経費：あり（工事${Math.round(r['工事部'] * 100)}%・DC${Math.round(r['事業開発部'] * 100)}%）`,
        note: `※ 本部（本部＋その他（総務部））の損益をそのまま工事部 ${Math.round(r['工事部'] * 100)}%・DC ${Math.round(r['事業開発部'] * 100)}% で配っています（この部門は ${pct}%）。万円単位。部門の入力がない期は描いていません。<br>※ 期ごとのブロック図の部門は、この表と同じ数字（本部経費の配賦後）です。` }
    : { fc: '固定費（部門自身・本部経費を含まない）', fcShort: '固定費', op: '経常利益（本部経費前）',
        sub: '仕訳の部門から集計・本部経費を除く ・ 本部経費：なし',
        note: '※ MF の仕訳に付いた部門で集計した実数です（本部・総務部の経費は含めていません）。万円単位。部門の入力がない期は描いていません。<br>※ 期ごとのブロック図の部門は、本部経費を入れた時の数字（配賦後）です。' };
}

// 下の表: 工事部 + DC + 本部経費 + 部門なし = 全社の経常利益（円で一致。画面は万円）
function renderHqTable() {
  const dy = trendDept();
  const rows = trendYears().filter(f => dy.years[f.year_key]).map(f => ({ f, e: dy.years[f.year_key] }));
  if (!rows.length) return '';
  const td = (v, k, fy) => `<td class="num${v < 0 ? ' trend-neg-cell' : ''}" data-fy="${fy}" data-k="${k}">${v.toLocaleString()}</td>`;
  const sfx = __trendHq ? '_本部経費込み' : '';
  const body = rows.map(({ f, e }) => {
    const g = e.groups;
    const hqCell = __trendHq
      ? `<td class="num trend-hq-done" data-fy="${f.year_key}" data-k="hq">配賦済み</td>`
      : td(toMan(g['本部'].ordinary_profit), 'hq', f.year_key);
    return `<tr><th>${f.year_label}<span>${f.period}</span>${e.dept_available ? '' : '<em class="trend-missing-mark">部門の入力なし</em>'}</th>`
      + td(toMan(g['工事部' + sfx].ordinary_profit), 'k', f.year_key)
      + td(toMan(g['DC' + sfx].ordinary_profit), 'd', f.year_key)
      + hqCell
      + td(toMan(g['部門なし'].ordinary_profit), 'none', f.year_key)
      + td(toMan(e.total_ordinary_profit), 'total', f.year_key) + '</tr>';
  }).join('');
  const formula = __trendHq ? '工事部 ＋ DC ＋ 部門なし ＝ 全社の経常利益（本部経費は工事部・DC に配賦済み）'
                            : '工事部 ＋ DC ＋ 本部経費 ＋ 部門なし ＝ 全社の経常利益';
  return `
    <div class="puzzle-card trend-hq-card">
      <div class="card-head">
        <h2>経常利益の内訳（本部経費・部門なし）</h2>
        <span class="head-sub">${formula} ・ 単位: 万円</span>
      </div>
      <table class="trend-table trend-hq-table">
        <thead><tr><th>期</th><th>工事部の経常利益</th><th>DC の経常利益</th><th>本部経費（本部・総務部）</th><th>部門なし</th><th>全社の経常利益</th></tr></thead>
        <tbody>${body}</tbody>
      </table>
      <div class="formula-note">※ 円では毎年 1 円まで一致します。画面は万円に丸めているため、行の足し算が 1 万円ずれることがあります。部門なし = MF の仕訳に部門が付いていない分。</div>
    </div>`;
}

// 通年推移タブ: 全社合計を選んでいる時は 工事部 と DC を上下に 2 枚（目盛りはカードごと）+ 内訳の表、
// 全社合計の推移はその下の「全社合計も見る」で開く。部門を選んだ時はその 1 枚だけ。
// 部門の実数（dept_years）が無い時は全社の 1 枚だけを出す
function renderTrend(selectVal) {
  const key = (selectVal && selectVal.startsWith('cluster:')) ? selectVal.slice('cluster:'.length) : '全社合計';
  const noData = `<div class="no-data-block"><div class="no-data-title">通年推移に使える完了期のデータがありません</div></div>`;
  const t = trendRows('全社合計');
  if (!trendDept()) {
    const note = `<div class="trend-pair-note">部門別の実数データが無いため、全社だけを表示しています</div>`;
    return t.length ? note + renderTrendCard('全社合計', t, trendScale([t]), '通年推移 ― 全社合計') : noData;
  }
  const r = trendDept().hq_allocation;
  const toggle = `<button type="button" class="trend-hq-toggle${__trendHq ? ' on' : ''}" onclick="toggleTrendHq()">`
    + (__trendHq ? '本部経費を外す' : `本部経費を入れる（工事${Math.round(r['工事部'] * 100)}%・DC${Math.round(r['事業開発部'] * 100)}%）`) + `</button>`;
  if (key !== '全社合計') {
    const rows = trendRows(key);
    if (!rows.length) return noData;
    return `<div class="trend-pair-note">通年推移 ― ${TREND_NAME[key]} ${toggle}</div>`
      + renderTrendCard(key, rows, trendScale([rows]), `通年推移 ― ${TREND_NAME[key] || key}`);
  }
  const k = trendRows('工事部'), d = trendRows('事業開発部');
  let html = `<div class="trend-pair-note">通年推移 ― 工事部と DC（就労移行支援）を分けて表示 ${toggle}</div>`;
  if (k.length) html += renderTrendCard('工事部', k, trendScale([k]), TREND_NAME['工事部']);
  if (d.length) html += renderTrendCard('事業開発部', d, trendScale([d]), TREND_NAME['事業開発部']);
  html += renderHqTable();
  if (t.length) html += `<details class="trend-total"><summary>全社合計も見る</summary>${renderTrendCard('全社合計', t, trendScale([t]), TREND_NAME['全社合計'])}</details>`;
  return html;
}

// 1 枚分: 結論 1 行 + 粗利（緑）と固定費（橙）の 2 本の折れ線（間を赤字なら薄い赤・黒字なら薄い緑で塗る）+ 表。
// missing の年は点を描かず、線と塗りをそこで途切れさせ、表は「—」
function renderTrendCard(key, rows, sc, title) {
  const T = trendTerms(key);
  const W = 1200, H = 360, ML = 70, MR = 40, MT = 30, MB = 58;
  const plotW = W - ML - MR, plotH = H - MT - MB;
  const { top, bot, step } = sc;
  // 下端に 26px の余白: 一番下の点の数字（点の下に出る）が期の名前に重ならないように
  const y = v => MT + (top - v) / (top - bot) * (plotH - 26);
  const x = i => rows.length === 1 ? ML + plotW / 2 : ML + 40 + (plotW - 80) * i / (rows.length - 1);
  const RED = 'rgba(220, 38, 38, 0.16)', GREEN = 'rgba(16, 185, 129, 0.18)';
  let svg = '';
  for (let t = bot; t <= top + 1e-9; t += step) {
    svg += `<line x1="${ML}" x2="${W - MR}" y1="${y(t)}" y2="${y(t)}" stroke="var(--gray-200)"/>`;
    svg += `<text x="${ML - 8}" y="${y(t) + 4}" text-anchor="end" class="trend-axis">${t.toLocaleString()}</text>`;
  }
  // 塗り: 隣り合う 2 年がどちらも描ける区間だけ。符号が変わる区間は交点（線形補間）で 2 つに分ける
  const poly = (pts, loss, fyL, fyR) =>
    `<polygon points="${pts.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ')}" fill="${loss ? RED : GREEN}" data-loss="${loss ? 1 : 0}" data-fy-left="${fyL}" data-fy-right="${fyR}"/>`;
  for (let i = 0; i + 1 < rows.length; i++) {
    const a = rows[i], b = rows[i + 1];
    if (a.missing || b.missing) continue;
    const d0 = a.v.fc - a.v.gp, d1 = b.v.fc - b.v.gp;   // 正 = 固定費が上（赤字）
    const x0 = x(i), x1 = x(i + 1);
    if ((d0 > 0 && d1 < 0) || (d0 < 0 && d1 > 0)) {
      const t = d0 / (d0 - d1);
      const xc = x0 + (x1 - x0) * t, yc = y(a.v.gp + (b.v.gp - a.v.gp) * t);
      svg += poly([[x0, y(a.v.gp)], [xc, yc], [x0, y(a.v.fc)]], d0 > 0, a.f.year_key, '');
      svg += poly([[xc, yc], [x1, y(b.v.gp)], [x1, y(b.v.fc)]], d1 > 0, '', b.f.year_key);
    } else {
      const loss = (d0 !== 0 ? d0 : d1) > 0;
      svg += poly([[x0, y(a.v.gp)], [x1, y(b.v.gp)], [x1, y(b.v.fc)], [x0, y(a.v.fc)]], loss, a.f.year_key, b.f.year_key);
    }
  }
  // 線: missing の年で区切った区間ごとに 1 本（1 年だけの区間は点のみ）
  const segs = [];
  rows.forEach((r, i) => {
    if (r.missing) { segs.push([]); return; }
    if (!segs.length) segs.push([]);
    segs[segs.length - 1].push(i);
  });
  const line = (k, color) => segs.filter(s => s.length > 1).map(s =>
    `<polyline class="trend-line" data-k="${k}" points="${s.map(i => x(i).toFixed(1) + ',' + y(rows[i].v[k]).toFixed(1)).join(' ')}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round"/>`).join('');
  svg += line('gp', 'var(--green-500)') + line('fc', 'var(--warn-500)');
  rows.forEach((r, i) => {
    if (!r.missing) {
      const gpUp = r.v.gp >= r.v.fc;   // 上にある方の数字は点の上、下にある方は点の下
      [['gp', 'var(--green-500)', gpUp], ['fc', 'var(--warn-500)', !gpUp]].forEach(([k, color, up]) => {
        svg += `<circle cx="${x(i)}" cy="${y(r.v[k])}" r="5" fill="${color}" stroke="#fff" stroke-width="1.5"/>`;
        svg += `<text x="${x(i)}" y="${y(r.v[k]) + (up ? -11 : 21)}" text-anchor="middle" class="trend-val trend-${k}" data-fy="${r.f.year_key}" data-k="${k}">${r.v[k].toLocaleString()}</text>`;
      });
    } else {
      svg += `<text x="${x(i)}" y="${MT + (plotH - 26) / 2}" text-anchor="middle" class="trend-missing" data-fy="${r.f.year_key}">部門の入力なし</text>`;
    }
    svg += `<text x="${x(i)}" y="${H - MB + 26}" text-anchor="middle" class="trend-year">${r.f.year_label}</text>`;
    svg += `<text x="${x(i)}" y="${H - MB + 44}" text-anchor="middle" class="trend-period">${r.f.period}</text>`;
  });
  const legend =
      `<span class="trend-leg"><i class="trend-leg-line" style="background:var(--green-500)"></i>粗利</span>`
    + `<span class="trend-leg"><i class="trend-leg-line" style="background:var(--warn-500)"></i>${T.fc}</span>`
    + `<span class="trend-leg"><i style="background:${RED}"></i>赤＝赤字の幅（${T.fcShort}が上）</span>`
    + `<span class="trend-leg"><i style="background:${GREEN}"></i>緑＝黒字の幅（粗利が上）</span>`;
  const td = (v, k, fy) => `<td class="num${k === 'op' && v < 0 ? ' trend-neg-cell' : ''}" data-fy="${fy}" data-k="${k}">${v.toLocaleString()}</td>`;
  const dash = (k, fy) => `<td class="num trend-missing-cell" data-fy="${fy}" data-k="${k}">—</td>`;
  const table = `
      <table class="trend-table">
        <thead><tr><th>期</th><th>売上</th><th>粗利</th><th>${T.fc}</th><th>${T.op}</th></tr></thead>
        <tbody>${rows.map(r => `<tr><th>${r.f.year_label}<span>${r.f.period}</span>${r.missing ? '<em class="trend-missing-mark">部門の入力なし</em>' : ''}</th>`
          + ['rev', 'gp', 'fc', 'op'].map(k => r.missing ? dash(k, r.f.year_key) : td(r.v[k], k, r.f.year_key)).join('') + '</tr>').join('')}</tbody>
      </table>`;
  const deptLabel = TREND_NAME[key] || key;
  return `
    <div class="puzzle-card trend-card" data-dept="${key}" data-hq="${key === '全社合計' ? '' : (__trendHq ? 'on' : 'off')}">
      <div class="card-head">
        <h2>${title}</h2>
        <span class="head-sub">${T.sub ? T.sub + ' ・ ' : '完了した期のみ・今期は期の途中のため除外 ・ '}単位: 万円 ・ 目盛りはカードごと</span>
      </div>
      <div class="trend-conclusion">${trendConclusion(rows, T.fcShort)}</div>
      <div class="trend-legend">${legend}</div>
      <svg class="trend-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="通年推移 ${deptLabel}">${svg}</svg>
      ${table}
      <div class="formula-note">${T.note}</div>
    </div>`;
}

// データなし期用のプレースホルダー HTML（通年推移タブもここから描く）
function renderNoDataPlaceholder(result) {
  if (result && result._trend) return renderTrend(_currentSelectVal);
  const label = (result._fy_label || '') + ' ' + (result._fy_period || '');
  const note = result._fy_note || 'データなし';
  if (result._dept_missing) {
    const name = escHtml(result._dept_name || '');
    return `
    <div class="no-data-block">
      <div class="no-data-title">${label} ${name}：${escHtml(note)}</div>
      <div class="no-data-note">この期は MF の仕訳から部門ごとの数字を出せないため、部門のブロック図は出していません（推定の数字は出しません）。</div>
      <div class="no-data-hint">全社合計、または他の会計期に切り替えて閲覧できます。</div>
    </div>
  `;
  }
  return `
    <div class="no-data-block">
      <div class="no-data-title">${label} はまだデータがありません</div>
      <div class="no-data-note">${note}</div>
      <div class="no-data-hint">他の会計期に切り替えて閲覧できます。</div>
    </div>
  `;
}

(async () => {
  try {
    const result = await loadData(_currentSelectVal);
    if (result._no_data) {
      document.getElementById('main-content').innerHTML = renderNoDataPlaceholder(result);
      document.getElementById('period-label').textContent =
        (result._fy_label || '') + ' ' + (result._fy_period || '');
      _bpData = null;
      _bpCmt = '';
      return;
    }
    _bpData = result.bp;
    _bpCmt  = result.commentary;
    render(result.bp, result.commentary);
    if (result._fy_label) {
      document.getElementById('period-label').textContent =
        result._fy_label + ' ' + (result._fy_period || '');
    }
  } catch (e) {
    document.getElementById('main-content').innerHTML =
      `<div class="error-msg">データ読み込みエラー: ${escHtml(e.message)}</div>`;
  }
})();
</script>
</body>
</html>
